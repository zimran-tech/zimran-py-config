[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zimran-config"
dynamic = ["version"]
description = "Pydantic based configuration for FastAPI services"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Zimran Tech" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["pydantic", "settings", "configuration", "fastapi", "zimran"]
dependencies = ["pydantic-settings>=2.0.0,<3.0.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/zimran-tech/zimran-py-config"
Repository = "https://github.com/zimran-tech/zimran-py-config"

[tool.hatch.version]
path = "zimran/config/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/zimran"]

[tool.hatch.build.targets.wheel]
packages = ["zimran"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "T20", "A"]

[tool.ruff.lint.isort]
known-first-party = ["zimran"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
disable_error_code = ["type-arg", "prop-decorator"]
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = [
    "--verbose",
    "--disable-warnings",
    "--show-capture=stdout",
    "--cov=zimran",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.report]
skip_covered = true
